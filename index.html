<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <title>SewerWorks</title>
    <style>
      .initial-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #070707;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
        color: #F3F3F3;
      }
      .initial-loader img {
        width: 100px;
        height: 100px;
        margin-bottom: 28px;
        animation: pulse-glow 2s infinite ease-in-out;
      }
      .initial-loader h1 {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 10px 0;
        letter-spacing: 2px;
      }
      .initial-loader h1 span {
        color: #FF5A09;
      }
      .initial-loader p {
        color: #7C7C7C;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 500;
      }
      @keyframes pulse-glow {
        0% { transform: scale(0.98); filter: drop-shadow(0 0 8px rgba(255, 90, 9, 0.2)); }
        50% { transform: scale(1.02); filter: drop-shadow(0 0 20px rgba(255, 90, 9, 0.6)); }
        100% { transform: scale(0.98); filter: drop-shadow(0 0 8px rgba(255, 90, 9, 0.2)); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <img src="/logo.svg" alt="SewerWorks Logo" />
        <h1>Sewer<span>Works</span></h1>
        <p>Iniciando Motor Hidráulico...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
