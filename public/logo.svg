<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Transparent background by default -->
  <!-- Outer ring representing the manhole / infrastructure boundary -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  
  <!-- Inner dark basin -->
  <circle cx="50" cy="50" r="40" fill="#000000" />
  
  <!-- Stylized 'S' / Pipe Network using the accent color -->
  <path d="M 35 30 
           C 75 30, 25 70, 65 70" 
        fill="none" 
        stroke="#FF5A09" 
        stroke-width="10" 
        stroke-linecap="round"/>
  
  <!-- Engineering Nodes in White -->
  <circle cx="35" cy="30" r="5" fill="#FFFFFF"/>
  <circle cx="65" cy="70" r="5" fill="#FFFFFF"/>
  
  <!-- Subtle center horizontal connection -->
  <line x1="25" y1="50" x2="75" y2="50" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
</svg>
